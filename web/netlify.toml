[build]
  command = "NODE_OPTIONS='--max-old-space-size=4096' npm run clean:build && NODE_ENV=production npm run build"
  publish = "out"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./src/"

[build.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_URL = "https://app-nest.com"
  NODE_VERSION = "18.17.0"
  NEXT_STATIC_BUILD = "true"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: app-nest.com *.app-nest.com; img-src 'self' data: https: blob: app-nest.com *.app-nest.com; style-src 'self' 'unsafe-inline' https: app-nest.com *.app-nest.com; font-src 'self' data: https: app-nest.com *.app-nest.com; connect-src 'self' https: wss: app-nest.com *.app-nest.com; frame-src 'self' https: app-nest.com *.app-nest.com;"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "X-Requested-With, Content-Type, Authorization"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Handle specific routes first
[[redirects]]
  from = "/apps/chat"
  to = "/apps/chat/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/apps/image-converter"
  to = "/apps/image-converter/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/features"
  to = "/features/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/portfolio/index.html"
  status = 200
  force = true

# Handle API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Handle 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
